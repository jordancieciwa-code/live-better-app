name: Validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Switch to `npm ci` once package-lock.json is committed.
      - run: npm install
      # Fail on high or critical advisories in production dependencies.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # next build can rewrite tsconfig.json and next-env.d.ts. Fail if it did,
      # so those edits get committed instead of appearing on every laptop.
      - run: git diff --exit-code
