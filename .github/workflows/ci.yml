name: Validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Switch to `npm ci` once package-lock.json is committed.
      - run: npm install
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
